name: Talkism Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/erp_ci_test
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      SUPER_ADMIN_NAME: Talkism CI Administrator
      SUPER_ADMIN_EMAIL: superadmin@erp.com
      SUPER_ADMIN_PASSWORD: SuperAdmin@2026!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend readiness
        run: |
          echo "Waiting for API and MongoDB initialization..."

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              echo
              echo "Backend is ready."
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Backend process exited during startup."
              cat server.log
              exit 1
            fi

            sleep 2
          done

          echo "Backend did not become ready within 60 seconds."
          cat server.log
          exit 1

      - name: Run API integration tests
        run: npm test

      - name: Build application (if configured)
        run: npm run build --if-present

      - name: Show backend logs on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi
